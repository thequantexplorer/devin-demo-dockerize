name: Stack check

# Builds the Docker stack, runs migrations and tests inside it,
# and checks /health. It fails until the repo has a Dockerfile
# and a docker-compose.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Docker files exist
        run: |
          missing=0
          for f in Dockerfile docker-compose.yml; do
            if [ ! -f "$f" ]; then echo "::error::$f is missing"; missing=1; fi
          done
          exit $missing

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Run migrations
        run: docker compose exec -T web flask --app wsgi db upgrade

      - name: Run tests
        run: docker compose exec -T web python -m pytest -q

      - name: Health check
        run: curl -fsS http://localhost:8000/health

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v || true
